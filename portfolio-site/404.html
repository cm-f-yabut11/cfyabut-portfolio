<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found – Clarence Matthew Yabut</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<link rel="stylesheet" href="/css/styles.css">
<style>
body{display:grid;place-items:center;min-height:100vh;padding:2rem;text-align:center}
.nf{position:relative;z-index:1;max-width:34rem}
.nf svg{width:min(60vw,14rem);height:auto;margin-bottom:.5rem;overflow:visible}
.nf h1{font-size:clamp(2.4rem,8vw,4rem);margin-bottom:1rem}
.nf p{color:var(--muted);margin:0 auto 1.5rem}
.bug{animation:rock 3s ease-in-out infinite;transform-origin:60px 70px}
@keyframes rock{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@media (prefers-reduced-motion:reduce){.bug{animation:none}}
</style>
<script>try{if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
</head>
<body>
<main class="nf" id="main">
  <svg viewBox="0 0 120 100" role="img" aria-label="A small red bug with big eyes">
    <g class="bug" fill="none" stroke="var(--sos)" stroke-width="4" stroke-linecap="square">
      <path d="M32 46 L12 40 M32 58 L10 60 M34 70 L16 84 M88 46 L108 40 M88 58 L110 60 M86 70 L104 84"/>
      <path d="M48 26 L40 10 M72 26 L80 10"/>
      <ellipse cx="60" cy="56" rx="30" ry="26" fill="var(--sos)" stroke="none"/>
      <circle class="beye" cx="49" cy="48" r="9" fill="var(--eye)" stroke="none"/>
      <circle class="beye" cx="71" cy="48" r="9" fill="var(--eye)" stroke="none"/>
      <circle class="bpup" cx="49" cy="48" r="4" fill="#0f1b33" stroke="none"/>
      <circle class="bpup" cx="71" cy="48" r="4" fill="#0f1b33" stroke="none"/>
      <path d="M50 68 Q60 62 70 68" stroke="#fff" stroke-width="3"/>
    </g>
  </svg>
  <h1>Page not found</h1>
  <p>Looks like this page got debugged. The link may be old or mistyped.</p>
  <a class="cta" href="/index.html">Back to the portfolio</a><a class="cta alt" href="/index.html#work">See my work</a>
</main>
<script>
(function(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  var eyes=[].slice.call(document.querySelectorAll('.beye')),pups=[].slice.call(document.querySelectorAll('.bpup')),q=0,x=0,y=0;
  addEventListener('pointermove',function(e){x=e.clientX;y=e.clientY;if(q)return;q=requestAnimationFrame(function(){q=0;pups.forEach(function(p,i){var r=eyes[i].getBoundingClientRect(),dx=x-(r.left+r.width/2),dy=y-(r.top+r.height/2),d=Math.hypot(dx,dy)||1,m=Math.min(4,d/20);p.style.transform='translate('+dx/d*m+'px,'+dy/d*m+'px)'})})},{passive:true});
})();
</script>
</body>
</html>
